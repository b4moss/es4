# Keep Scorecard Dependency-Update-Tool green, but avoid major-bump floods.
# Majors are ignored; patch/minor are grouped into fewer PRs.
# Go-only: github-actions + gomod (no npm / composer — es4 has neither).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - github-actions
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
    groups:
      github-actions:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: gomod
    directory: /packages/go
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - go
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
    groups:
      go-modules:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
