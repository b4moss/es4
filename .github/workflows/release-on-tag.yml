name: Release on tag

# Root SemVer tags (vX.Y.Z) and nested Go module tags (packages/go/vX.Y.Z).
on:
  push:
    tags:
      - "v[0-9]*"
      - "packages/go/v[0-9]*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Create GitHub Release if missing
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release already exists: $TAG"
            exit 0
          fi
          PRE=()
          if [[ "$TAG" =~ (alpha|beta|rc|rev|doc|docs) ]]; then
            PRE+=(--prerelease)
          fi
          TITLE="$TAG"
          if [[ "$TAG" == packages/go/v* ]]; then
            TITLE="Go ${TAG#packages/go/}"
          fi
          gh release create "$TAG" \
            --title "$TITLE" \
            --generate-notes \
            --verify-tag \
            "${PRE[@]}"
